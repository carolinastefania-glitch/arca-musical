<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arca Musical</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <div class="contenedor">

        <h1>🎼 Arca Musical</h1>

        <p class="subtitulo">
            Toda la música de tu parroquia en un solo lugar
        </p>

        <input
            type="text"
            id="buscador"
            placeholder="🔍 ¿Qué canto estás buscando?"
        >

        <div id="resultados-busqueda" class="categorias"></div>


        <!-- ========================= -->
        <!-- PARTES DE LA MISA -->
        <!-- ========================= -->

        <h2 class="titulo-seccion">
            🎵 Partes de la Misa
        </h2>

        <div id="partes-misa" class="categorias"></div>


        <!-- ========================= -->
        <!-- TIEMPOS LITÚRGICOS -->
        <!-- ========================= -->

        <h2 class="titulo-seccion">
            📅 Tiempos Litúrgicos
        </h2>

        <div id="tiempos-liturgicos" class="categorias"></div>


        <!-- ========================= -->
        <!-- CELEBRACIONES ESPECIALES -->
        <!-- ========================= -->

        <h2 class="titulo-seccion">
            ⛪ Celebraciones Especiales
        </h2>

        <div id="celebraciones" class="categorias"></div>

    </div>


    <script src="js/datos.js"></script>
    <script src="js/cantos.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
